version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current: Dependabot opens PRs that bump
  # the pin to the new commit SHA (and the # vX.Y.Z comment), so pinning does
  # not mean going stale. This is the only ecosystem in the repo (no package
  # manifest or Dockerfile), and "/" covers every workflow in .github/workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Ho_Chi_Minh
    # Wait a week before proposing a brand-new release, so a compromised or
    # yanked release is usually caught before it reaches the pinned workflows
    # that run with contents: write (release.yml, google-versions.yml).
    # Cooldown only delays version updates; security updates are not delayed.
    cooldown:
      default-days: 7
    # One PR per week for routine bumps; a major bump stays its own PR so it
    # gets a real look.
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
