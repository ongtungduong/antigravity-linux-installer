name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily: catches Google changing the download page the installer parses.
    - cron: "17 3 * * *"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n install.sh
      - run: bash install.sh --status
      - name: Resolve official download URLs
        run: bash install.sh --all --print-downloads
