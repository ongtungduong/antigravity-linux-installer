name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint and offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # One invocation per file: `bash -n a b` only checks `a` and treats `b` as its argument.
      - name: Syntax
        run: |
          bash -n antigravity-linux
          bash -n tests/run.sh
          bash -n tools/google-versions.sh
      - name: ShellCheck
        run: shellcheck -S warning antigravity-linux tools/google-versions.sh
      - name: Tests
        run: bash tests/run.sh

  # The scheduled check of Google's page lives in google-versions.yml.
  live:
    name: Google download page
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash antigravity-linux --status
      - name: Resolve official download URLs
        run: |
          out=$(bash antigravity-linux --all --print-downloads)
          printf '%s\n' "$out"
          # "unknown" means the URL layout changed and versions can no longer be compared.
          if grep -q ' unknown:' <<<"$out"; then
            echo "::error::Could not read a version from the download URLs; update version_from_url."
            exit 1
          fi
